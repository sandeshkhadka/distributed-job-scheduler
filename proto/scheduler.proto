syntax = "proto3";

package djs;

message RegisterWorkerRequest {
  int32 cpu_cores = 1;
  float mem_size = 2;
  float disk_size = 3;
  float cpu_freq = 4;
  string os = 5;
  string name = 6;
}

message RegisterWorkerReply {
  bool ok = 1;
  string message = 2;
  int32 worker_id = 3;
}

message SubmitJobRequest {
  int32 client_id = 1;
  string job_type = 2;
  map<string, string> params = 3;
}

message SubmitJobReply {
  string job_id = 1;
  bool accepted = 2;
  string message = 3;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusReply {
  string status = 1;
  string assigned_worker_id = 2;
}

message GetJobRequest {
  int32 worker_id = 1;
}

message GetJobResponse {
  int32 job_id = 1;
  string job_type = 2;
  map<string, string> params = 3;
}

message RegisterClientRequest {
  string hostname = 1;
}

message RegisterClientResponse {
  int32 client_id = 1;
  bool ok = 2;
  string message = 3;
}

message ReportJobResultRequest {
  int32 worker_id = 1;
  int32 job_id = 2;
  bool success = 3;
  string message = 4;
  string artifact_url = 5;
  string metrics_json = 6;
}

message ReportJobResultReply {
  bool ok = 1;
}

message ConfirmJobReceivedRequest {
  int64 job_id = 1;
  int64 worker_id = 2;
}

message ConfirmJobReceivedResponse {
  bool accepted = 1;
  string message = 2;
}

message ReportJobStartedRequest {
  int64 job_id = 1;
  int64 worker_id = 2;
}

message ReportJobStartedResponse {
  bool accepted = 1;
  string message = 2;
}

message WorkerMetrics {
  int64 worker_id = 1;
  double cpu_percent = 2;
  double memory_percent = 3;
  double memory_used_mb = 4;
  double memory_total_mb = 5;
  double disk_used_mb = 6;
  double disk_total_mb = 7;
  double disk_percent = 8;
  double rx_bytes_per_sec = 9;
  double tx_bytes_per_sec = 10;
  double load_avg_1m = 11;
  int64 active_jobs = 12;
  int64 timestamp = 13;
}

message ReportWorkerMetricsResponse {
  bool accepted = 1;
}

message JobEbpfMetrics {
  int64 job_id = 1;
  int64 worker_id = 2;
  double timestamp = 3;
  int64 syscall_read_count = 4;
  int64 syscall_write_count = 5;
  int64 syscall_openat_count = 6;
  int64 io_read_bytes = 7;
  int64 io_write_bytes = 8;
  int64 net_tx_bytes = 9;
  int64 net_rx_bytes = 10;
  int64 cpu_usage_us = 11;
  int64 mem_current_bytes = 12;
}

message ReportJobEbpfMetricsRequest {
  int64 worker_id = 1;
  repeated JobEbpfMetrics metrics = 2;
}

message ReportJobEbpfMetricsResponse {
  bool accepted = 1;
}

message GetJobTimeseriesRequest {
  int64 job_id = 1;
  int64 limit = 2;
}

message GetJobTimeseriesResponse {
  repeated JobEbpfMetrics points = 1;
}

service SchedulerService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerReply);
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobReply);
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusReply);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc RegisterClient(RegisterClientRequest) returns (RegisterClientResponse);
  rpc ReportJobResult(ReportJobResultRequest) returns (ReportJobResultReply);
  rpc ConfirmJobReceived(ConfirmJobReceivedRequest) returns (ConfirmJobReceivedResponse);
  rpc ReportJobStarted(ReportJobStartedRequest) returns (ReportJobStartedResponse);
  rpc ReportWorkerMetrics(WorkerMetrics) returns (ReportWorkerMetricsResponse);
  rpc ReportJobEbpfMetrics(ReportJobEbpfMetricsRequest) returns (ReportJobEbpfMetricsResponse);
  rpc GetJobTimeseries(GetJobTimeseriesRequest) returns (GetJobTimeseriesResponse);
}
